version: 2

models:
  - name: stg_funda_price_history
    description: Historical price events per listing (asking prices, WOZ assessments, sales).
    config:
      contract:
        enforced: true
    meta:
      dagster:
        group: funda
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - global_id
            - price_date
            - price_source
            - price_status
    columns:
      - name: global_id
        description: Funda internal listing ID.
        data_type: text
        constraints:
          - type: not_null
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_funda_listings')
              field: global_id
      - name: price
        description: Price at this point in time.
        data_type: bigint
        data_tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              where: "price is not null"
      - name: human_price
        description: Human-readable price string.
        data_type: text
      - name: price_date
        description: Date of this price event.
        data_type: text
        constraints:
          - type: not_null
        data_tests:
          - not_null
      - name: price_timestamp
        description: Timestamp of this price event.
        data_type: text
      - name: price_source
        description: Source of the price data.
        data_type: text
        constraints:
          - type: not_null
        data_tests:
          - not_null
          - accepted_values:
              values: ["Funda", "WOZ"]
      - name: price_status
        description: Type of price event.
        data_type: text
        constraints:
          - type: not_null
        data_tests:
          - not_null
          - accepted_values:
              values: ["asking_price", "sold", "woz", "withdrawn"]
      - name: ingested_at
        description: Timestamp when the row was written to the raw table.
        data_type: timestamptz
        constraints:
          - type: not_null
        data_tests:
          - not_null
