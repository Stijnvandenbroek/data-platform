version: 2

models:
  - name: stg_funda_listings
    description: Cleaned Funda listing details – one row per property.
    config:
      contract:
        enforced: true
    meta:
      dagster:
        group: funda
    columns:
      - name: global_id
        description: Funda internal listing ID.
        data_type: text
        constraints:
          - type: not_null
          - type: unique
        data_tests:
          - unique
          - not_null
      - name: tiny_id
        description: Public ID used in Funda URLs.
        data_type: text
        constraints:
          - type: not_null
        data_tests:
          - not_null
      - name: title
        description: Property address / title.
        data_type: text
      - name: city
        description: City name.
        data_type: text
        constraints:
          - type: not_null
        data_tests:
          - not_null
      - name: postcode
        description: Dutch postal code.
        data_type: text
      - name: province
        description: Province name.
        data_type: text
      - name: neighbourhood
        description: Neighbourhood name.
        data_type: text
      - name: municipality
        description: Municipality name.
        data_type: text
      - name: price
        description: Asking or rental price in euros.
        data_type: bigint
        data_tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              where: "price is not null"
      - name: price_formatted
        description: Human-readable price string from Funda.
        data_type: text
      - name: status
        description: Listing status.
        data_type: text
        constraints:
          - type: not_null
        data_tests:
          - not_null
          - accepted_values:
              values: ["available", "sold", "withdrawn", "under_negotiation"]
      - name: offering_type
        description: Buy or rent.
        data_type: text
        data_tests:
          - not_null
      - name: object_type
        description: Property type (house, apartment, etc.).
        data_type: text
      - name: house_type
        description: Sub-type of the property.
        data_type: text
      - name: construction_type
        description: Construction method.
        data_type: text
      - name: construction_year
        description: Year the property was built.
        data_type: text
      - name: energy_label
        description: Dutch energy performance label (A–G).
        data_type: text
        data_tests:
          - accepted_values:
              values: ["A5", "A4", "A3", "A2", "A1", "A", "B", "C", "D", "E", "F", "G"]
              where: "energy_label is not null"
      - name: living_area
        description: Interior floor area in m².
        data_type: integer
        data_tests:
          - dbt_utils.expression_is_true:
              expression: "> 0"
              where: "living_area is not null"
      - name: plot_area
        description: Total plot area in m².
        data_type: integer
      - name: bedrooms
        description: Number of bedrooms.
        data_type: integer
      - name: rooms
        description: Total number of rooms.
        data_type: integer
      - name: publication_date
        description: Listing publication date.
        data_type: text
      - name: latitude
        description: Latitude coordinate.
        data_type: double precision
      - name: longitude
        description: Longitude coordinate.
        data_type: double precision
      - name: has_garden
        description: Whether the property has a garden.
        data_type: boolean
      - name: has_balcony
        description: Whether the property has a balcony.
        data_type: boolean
      - name: has_solar_panels
        description: Whether solar panels are present.
        data_type: boolean
      - name: has_heat_pump
        description: Whether a heat pump is installed.
        data_type: boolean
      - name: has_roof_terrace
        description: Whether the property has a roof terrace.
        data_type: boolean
      - name: is_energy_efficient
        description: Whether the listing is flagged as energy efficient.
        data_type: boolean
      - name: is_monument
        description: Whether the property is a protected monument.
        data_type: boolean
      - name: url
        description: Direct link to the Funda listing.
        data_type: text
      - name: photo_count
        description: Number of photos on the listing.
        data_type: integer
      - name: views
        description: Number of times the listing was viewed.
        data_type: integer
      - name: saves
        description: Number of times the listing was saved as favourite.
        data_type: integer
      - name: ingested_at
        description: Timestamp when the row was written to the raw table.
        data_type: timestamptz
        constraints:
          - type: not_null
        data_tests:
          - not_null
