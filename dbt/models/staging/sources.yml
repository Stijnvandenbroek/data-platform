version: 2

sources:
  - name: raw_funda
    schema: raw_funda
    description: >
      Raw Funda real-estate data ingested by Dagster assets.
    tables:
      - name: search_results
        description: Funda search results (broad overview of matching listings).
        meta:
          dagster:
            asset_key: ["raw_funda_search_results"]
        loaded_at_field: last_seen_at
        freshness:
          warn_after: { count: 12, period: hour }
          error_after: { count: 25, period: hour }
        columns:
          - name: global_id
            description: Funda internal listing ID.
            data_tests:
              - unique
              - not_null
          - name: title
            description: Property address / title.
            data_tests:
              - not_null
          - name: city
            description: City name.
            data_tests:
              - not_null
          - name: price
            description: Asking or rental price in euros.
          - name: is_active
            description: False when the listing has not appeared in search results for 7+ days.
            data_tests:
              - not_null
              - accepted_values:
                  values: [true, false]
          - name: last_seen_at
            description: Timestamp the listing was last returned by the Funda search API.
            data_tests:
              - not_null
          - name: ingested_at
            description: Timestamp when the row was first written.
            data_tests:
              - not_null

      - name: listing_details
        description: >
          Full listing details fetched per search result (50+ fields).
        meta:
          dagster:
            asset_key: ["raw_funda_listing_details"]
        loaded_at_field: last_fetched_at
        freshness:
          warn_after: { count: 25, period: hour }
          error_after: { count: 49, period: hour }
        columns:
          - name: global_id
            description: Funda internal listing ID.
            data_tests:
              - not_null
              - relationships:
                  to: source('raw_funda', 'search_results')
                  field: global_id
          - name: tiny_id
            description: Public ID used in Funda URLs.
            data_tests:
              - not_null
          - name: price
            description: Asking or rental price in euros.
          - name: status
            description: Listing status (available or sold).
            data_tests:
              - not_null
              - accepted_values:
                  values: ["available", "sold", "withdrawn", "under_negotiation"]
          - name: is_stale
            description: True when the parent search listing is no longer active.
            data_tests:
              - not_null
              - accepted_values:
                  values: [true, false]
          - name: last_fetched_at
            description: Timestamp of the most recent detail fetch.
            data_tests:
              - not_null
          - name: ingested_at
            description: Timestamp when the row was first written.
            data_tests:
              - not_null

      - name: price_history
        description: >
          Historical price data per listing (asking prices, WOZ, sales).
        meta:
          dagster:
            asset_key: ["raw_funda_price_history"]
        loaded_at_field: ingested_at
        freshness:
          warn_after: { count: 25, period: hour }
          error_after: { count: 49, period: hour }
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns:
                - global_id
                - date
                - source
                - status
        columns:
          - name: global_id
            description: Funda internal listing ID.
            data_tests:
              - not_null
              - relationships:
                  to: source('raw_funda', 'listing_details')
                  field: global_id
          - name: price
            description: Price at this point in time.
          - name: date
            description: Date of this price event.
            data_tests:
              - not_null
          - name: source
            description: Price data source (funda or woz).
            data_tests:
              - not_null
              - accepted_values:
                  values: ["Funda", "WOZ"]
          - name: status
            description: Price event type (asking_price, sold, or woz).
            data_tests:
              - not_null
              - accepted_values:
                  values: ["asking_price", "sold", "woz", "withdrawn"]
          - name: ingested_at
            description: Timestamp when the row was written.
            data_tests:
              - not_null
