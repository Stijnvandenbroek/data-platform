[project]
name = "data-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "dagster",
    "dagster-webserver",
    "dagster-postgres",
    "dagster-dbt",
    "dbt-core",
    "dbt-postgres",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_platform"]

[tool.uv]
dev-dependencies = [
    "pytest",
    "dagster-webserver",
]
