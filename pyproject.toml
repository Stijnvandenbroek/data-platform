[project]
name = "data-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "dagster",
    "dagster-webserver",
    "dagster-postgres",
    "dagster-dbt",
    "dbt-core",
    "dbt-postgres",
    "pyfunda",
    "jinja2",
    "elementary-data[postgres]",
    "mlflow",
    "lightgbm",
    "scikit-learn",
    "pandas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_platform"]

[tool.dagster]
module_name = "data_platform.definitions"
attribute = "defs"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "sqlfluff",
    "chardet<6",
    "pre-commit",
]

[tool.pytest.ini_options]
